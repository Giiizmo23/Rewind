<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick a Rewind icon</title>
<style>
  html,body{margin:0;background:#111;color:#f6f4ef;font-family:-apple-system,system-ui,sans-serif}
  h1{font-size:28px;margin:28px 20px 8px}
  p{margin:0 20px 18px;color:#c8c2b8;font-size:17px;line-height:1.35}
  .stack{display:flex;flex-direction:column;gap:16px;padding:0 20px 40px}
  figure{margin:0;background:#1c1c1c;border-radius:22px;overflow:hidden}
  img{width:100%;display:block;background:#14110f}
  figcaption{padding:14px 16px 16px;font-size:22px;font-weight:700}
</style>
</head>
<body>
<h1>Two left</h1>
<p>The app icon is still the tape. Tell me 1 or 4.</p>
<div class="stack">
<figure><img src="1.jpg" alt="Rewind arrows"><figcaption>1. Rewind arrows</figcaption></figure>
<figure><img src="4.jpg" alt="Little TV"><figcaption>4. Little TV</figcaption></figure>
</div>
</body>
</html>
